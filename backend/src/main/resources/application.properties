
spring.application.name=gcv-backend

# ==========================================
# SERVIDOR
# ==========================================
server.port=${PORT:8080}

# ==========================================
# POSTGRESQL - NEON
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-wandering-river-bd4133i1.c-8.us-east-2.aws.neon.tech:5432/veterinaria_db?sslmode=require}
spring.datasource.username=${DB_USERNAME:veterinaria_db_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIBERNATE / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
